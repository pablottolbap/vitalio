name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npx eslint src scripts --max-warnings 0

      - name: Lint data integrity
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run coverage

  build:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production version
        run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_TURNSTILE_KEY: ${{ secrets.VITE_TURNSTILE_KEY }}

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✓ Build successful"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: GitHub Action
          user_email: action@github.com

      - name: Create deployment status
        if: success()
        run: |
          echo "✅ Deployment successful"
          echo "📦 Version: ${{ github.ref_name }}"
          echo "🚀 Available at: https://pablottolbap.github.io/vitalio/"
